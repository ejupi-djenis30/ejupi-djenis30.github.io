<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Ejupi Labs open-source product archive</title>
  <desc id="description">An editorial index of seven maintained open-source products, with direct product and source links.</desc>
  <rect width="1200" height="630" fill="#F4F1EA"/>
