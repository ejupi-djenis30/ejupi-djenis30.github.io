      <text x="64" y="18" font-size="14" font-weight="700" letter-spacing="1.8" fill="#E97A4A">03</text>
      <text x="64" y="40" font-size="22" font-weight="700" fill="#F4F1EA">Stop</text>
    </g>

    <rect x="34" y="410" width="240" height="1" fill="#4B4E4E"/>
    <text x="34" y="444" font-size="14" letter-spacing="1.4" fill="#B7B7B2">DOCUMENTATION ONLY</text>
