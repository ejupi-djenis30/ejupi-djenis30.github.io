<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">JDoor Assist engineering record</title>
  <desc id="description">Source 1.0.0, manual distribution and four explicit design trade-offs for JDoor Assist.</desc>
  <rect width="1200" height="630" fill="#F4F1EA"/>
  <rect x="0" y="0" width="1200" height="12" fill="#B44A2A"/>
  <image href="./brand/ejupi-labs-primary-carbon.svg" x="38" y="22" width="310" height="96"/>

  <g font-family="Avenir Next, Segoe UI, Arial, sans-serif" fill="#0E1111">
    <text x="64" y="174" font-size="16" font-weight="700" letter-spacing="2.8" fill="#B44A2A">ENGINEERING RECORD · SOURCE 1.0.0</text>
    <text x="64" y="282" font-size="82" font-weight="700" letter-spacing="-4.2">JDoor Assist</text>
    <text x="64" y="356" font-size="40" font-weight="500" letter-spacing="-1.2">Working source.</text>
    <text x="64" y="406" font-size="40" font-weight="500" letter-spacing="-1.2">Deliberate limits.</text>
    <line x1="64" y1="466" x2="714" y2="466" stroke="#0E1111"/>
    <text x="64" y="508" font-size="18" fill="#565D60">Distribution</text>
    <text x="190" y="508" font-size="18" font-weight="700">Manual · no tagged release or signed installer</text>
  </g>

  <g transform="translate(790 64)" font-family="Avenir Next, Segoe UI, Arial, sans-serif">
    <rect width="348" height="502" fill="#0E1111"/>
    <text x="30" y="50" font-size="14" font-weight="700" letter-spacing="2.2" fill="#F4F1EA">CHOICE / ALTERNATIVE / COST</text>
    <line x1="30" y1="74" x2="318" y2="74" stroke="#4F5353"/>

    <text x="30" y="122" font-family="Consolas, monospace" font-size="13" fill="#E97A4A">01</text>
    <text x="72" y="122" font-size="20" font-weight="700" fill="#F4F1EA">Java 21 + Swing</text>
    <text x="72" y="148" font-size="13" fill="#AAAFAA">desktop privileges / platform packaging</text>

    <text x="30" y="208" font-family="Consolas, monospace" font-size="13" fill="#E97A4A">02</text>
    <text x="72" y="208" font-size="20" font-weight="700" fill="#F4F1EA">Direct trusted LAN</text>
    <text x="72" y="234" font-size="13" fill="#AAAFAA">no relay / no internet traversal</text>

    <text x="30" y="294" font-family="Consolas, monospace" font-size="13" fill="#E97A4A">03</text>
    <text x="72" y="294" font-size="20" font-weight="700" fill="#F4F1EA">Pinned ephemeral TLS</text>
    <text x="72" y="320" font-size="13" fill="#AAAFAA">no account PKI / trusted link channel</text>

    <text x="30" y="380" font-family="Consolas, monospace" font-size="13" fill="#E97A4A">04</text>
    <text x="72" y="380" font-size="17" font-weight="700" fill="#F4F1EA">View-only, bounded protocol</text>
    <text x="72" y="406" font-size="13" fill="#AAAFAA">less capability / less surface</text>

    <line x1="30" y1="446" x2="318" y2="446" stroke="#4F5353"/>
    <text x="30" y="480" font-size="13" letter-spacing="1.7" fill="#AAAFAA">EVIDENCE BEFORE DISTRIBUTION</text>
    <rect x="302" y="468" width="16" height="16" fill="#E97A4A"/>
  </g>
</svg>
