      <text x="64" y="18" font-size="14" font-weight="700" letter-spacing="1.8" fill="#E97A4A">02</text>
      <text x="64" y="40" font-size="22" font-weight="700" fill="#F4F1EA">Authorize</text>
    </g>
    <g transform="translate(34 316)">
